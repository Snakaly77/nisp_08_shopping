<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep - Lista Zakupów</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="container header-content">
            <h1 class="logo">🍇 Świeży Market</h1>
            <a href="koszyk.html" class="cart-btn">
                🛒 Koszyk
            </a>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Nasze Produkty</h2>
        
        <div class="products-grid">
            <div class="product-card">
                <div class="product-icon">🍎</div>
                <h3 class="product-name">Czerwone Jabłko</h3>
                <p class="product-price">2.50 PLN</p>
                <button class="add-to-cart-btn" data-id="1" data-name="Czerwone Jabłko" data-price="2.50">
                    Dodaj do koszyka
                </button>
            </div>

            <div class="product-card">
                <div class="product-icon">🍌</div>
                <h3 class="product-name">Banan Premium</h3>
                <p class="product-price">4.20 PLN</p>
                <button class="add-to-cart-btn" data-id="2" data-name="Banan Premium" data-price="4.20">
                    Dodaj do koszyka
                </button>
            </div>

            <div class="product-card">
                <div class="product-icon">🥑</div>
                <h3 class="product-name">Dojrzałe Awokado</h3>
                <p class="product-price">6.99 PLN</p>
                <button class="add-to-cart-btn" data-id="3" data-name="Dojrzałe Awokado" data-price="6.99">
                    Dodaj do koszyka
                </button>
            </div>

            <div class="product-card">
                <div class="product-icon">🥐</div>
                <h3 class="product-name">Maślany Croissant</h3>
                <p class="product-price">3.50 PLN</p>
                <button class="add-to-cart-btn" data-id="4" data-name="Maślany Croissant" data-price="3.50">
                    Dodaj do koszyka
                </button>
            </div>
        </div>
    </main>
<script src="app.js"></script>
</body>
</html>
